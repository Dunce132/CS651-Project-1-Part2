<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Contact - Company A</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>

<body>
  <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
      <a class="navbar-brand" href="index.html">Company A</a>
    </div>
  </nav>

  <main class="container mt-4">
    <img src="images/contact.jpg" alt="Contact" class="img-fluid">

    <div class="float-box">
      <p>Email: abc@email.com</p>
    </div>

    <h2>Contact Us</h2>

    <form onsubmit="showAlert(); return false;">
      <label>Name:</label>
      <input type="text" class="form-control mb-2" required>

      <label>Email:</label>
      <input type="email" class="form-control mb-2" required>

      <button class="btn btn-primary">Submit</button>
    </form>
  </main>

  <script src="js/main.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
